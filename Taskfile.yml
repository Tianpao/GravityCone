version: '3'

vars:
  APP_NAME: "gravitycone"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Microsoft OAuth2 credentials — set these at build time to embed in the binary.
  # Example: task build MS_CLIENT_ID=xxx MS_CLIENT_SECRET=yyy
  # In GitHub Actions, use secrets: MS_CLIENT_ID=${{ secrets.MS_CLIENT_ID }} MS_CLIENT_SECRET=${{ secrets.MS_CLIENT_SECRET }}
  MS_CLIENT_ID: ""
  MS_CLIENT_SECRET: ""
  # Naids OAuth2 credentials — same pattern as Microsoft above.
  NAIDS_CLIENT_ID: ""
  NAIDS_CLIENT_SECRET: ""

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  ios: ./build/ios/Taskfile.yml
  android: ./build/android/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{OS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{OS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{OS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:cli:
    summary: Builds the CLI version (no GUI, stdio JSON protocol)
    cmds:
      - go build -tags cli -trimpath -ldflags="-w -s{{if .MS_CLIENT_ID}} -X main.msClientID={{.MS_CLIENT_ID}}{{end}}{{if .MS_CLIENT_SECRET}} -X main.msClientSecret={{.MS_CLIENT_SECRET}}{{end}}{{if .NAIDS_CLIENT_ID}} -X main.naidsClientID={{.NAIDS_CLIENT_ID}}{{end}}{{if .NAIDS_CLIENT_SECRET}} -X main.naidsClientSecret={{.NAIDS_CLIENT_SECRET}}{{end}}" -o "{{.BIN_DIR}}/{{.APP_NAME}}-cli{{exeExt}}" .

  build:cli:dev:
    summary: Builds the CLI version in development mode
    cmds:
      - go build -tags cli -o "{{.BIN_DIR}}/{{.APP_NAME}}-cli{{exeExt}}" .

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker

  # =========================================================================
  # Android FFI SDK
  # =========================================================================

  build:android:ffi:download:
    summary: Downloads EasyTier FFI .so for both arm64 and amd64
    cmds:
      - go run ffi/android/scripts/ensure_easytier_ffi.go arm64 ffi/android/jniLibs/arm64-v8a
      - go run ffi/android/scripts/ensure_easytier_ffi.go amd64 ffi/android/jniLibs/x86_64

  build:android:ffi:compile:
    summary: Cross-compiles libgravitycone.so for Android (arm64 + amd64)
    deps:
      - build:android:ffi:download
    vars:
      # NDK toolchain: needs Android NDK installed. Override with ANDROID_NDK_HOME.
      NDK_ROOT:
        sh: 'echo "${ANDROID_NDK_HOME:-$([ -d "$HOME/Library/Android/sdk/ndk" ] && ls -d "$HOME/Library/Android/sdk/ndk/"* 2>/dev/null | sort -V | tail -1 || ls -d "$HOME/Android/Sdk/ndk/"* 2>/dev/null | sort -V | tail -1)}"'
    cmds:
      - task: build:android:ffi:compile:arch
        vars: {ARCH: arm64, ABI: arm64-v8a}
      - task: build:android:ffi:compile:arch
        vars: {ARCH: amd64, ABI: x86_64}

  build:android:ffi:compile:arch:
    internal: true
    summary: Compiles libgravitycone.so for one Android architecture
    vars:
      ARCH: '{{.ARCH | default "arm64"}}'
      ABI: '{{.ABI | default "arm64-v8a"}}'
      MIN_SDK: '21'
    cmds:
      - |
        # Determine toolchain from NDK
        NDK_ROOT="{{.NDK_ROOT}}"
        if [ -z "$NDK_ROOT" ] || [ ! -d "$NDK_ROOT" ]; then
          echo "Android NDK not found. Set ANDROID_NDK_HOME or install NDK."
          echo "Install: sdkmanager 'ndk;26.3.11579264'"
          exit 1
        fi

        case "$(uname -s)" in
          Darwin) HOST_TAG="darwin-x86_64" ;;
          Linux)  HOST_TAG="linux-x86_64" ;;
          *)      echo "Cross-compilation from Windows not supported."; exit 1 ;;
        esac

        TOOLCHAIN="$NDK_ROOT/toolchains/llvm/prebuilt/$HOST_TAG"

        case "{{.ARCH}}" in
          arm64)
            export CC="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang"
            export CXX="$TOOLCHAIN/bin/aarch64-linux-android{{.MIN_SDK}}-clang++"
            export GOARCH=arm64
            ;;
          amd64)
            export CC="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang"
            export CXX="$TOOLCHAIN/bin/x86_64-linux-android{{.MIN_SDK}}-clang++"
            export GOARCH=amd64
            ;;
        esac

        export CGO_ENABLED=1
        export GOOS=android

        mkdir -p ffi/android/jniLibs/{{.ABI}}

        go build -tags et_ffi -buildmode=c-shared \
          -trimpath \
          -ldflags="-w -s" \
          -o ffi/android/jniLibs/{{.ABI}}/libgravitycone.so \
          ./ffi/common/

  build:android:ffi:sdk:
    summary: |
      Builds the complete Android FFI SDK package.
      Output: ffi/android/dist/gravitycone-android-sdk.zip
    deps:
      - build:android:ffi:compile
    cmds:
      - mkdir -p ffi/android/dist
      - |
        cd ffi/android
        zip -r dist/gravitycone-android-sdk.zip \
          jniLibs/arm64-v8a/libeasytier_ffi.so \
          jniLibs/arm64-v8a/libgravitycone.so \
          jniLibs/x86_64/libeasytier_ffi.so \
          jniLibs/x86_64/libgravitycone.so \
          java/net/gravitycone/ffi/GravityConeAndroidAPI.java
      - echo "SDK package created: ffi/android/dist/gravitycone-android-sdk.zip"
